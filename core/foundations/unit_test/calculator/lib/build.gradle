plugins {
    // Apply the groovy Plugin to add support for Groovy.
    id 'groovy'

    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'

    // Apply the TestLogger plugin for better logging of tests.
    id 'com.adarshr.test-logger' version '4.0.0'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use the latest Groovy version for building this library
    implementation libs.groovy.all

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation libs.guava

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api libs.commons.math3
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use Spock test framework
            useSpock('2.4-groovy-4.0')
        }
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

testlogger {
    theme 'mocha'           // Temas: standard, mocha, plain, etc.
    showSummary true        // Muestra el resumen final
    showPassed true         // Muestra pruebas pasadas (opcional)
    showFailed true         // Muestra pruebas fallidas (opcional)
}